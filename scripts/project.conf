# 상태창 스크립트 설정. 비밀값·호스트 절대경로는 ENV에 둔다.
COMPOSE_FILE=compose.yml
BUILD_PROFILE=package
DEV_PROFILE=development
PROD_PROFILE=runtime
BUILD_SERVICES=backend-image frontend-image pdf-image
BUILD_SOURCES=backend/Dockerfile frontend/Dockerfile infra/pdf/Dockerfile
DEV_SERVICES=db backend frontend pdf nginx
PROD_SERVICES=db backend-runtime frontend-runtime pdf-runtime nginx-runtime
REQUIRED_ENV=APP_ENV COMPOSE_PROFILES APP_PORT APP_BIND_ADDRESS APP_PUBLIC_URL SESSION_COOKIE_SECURE DB_DATA_DIR DB_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD POSTGRES_IMAGE NGINX_IMAGE PLATFORM_BASE_URL PLATFORM_PROJECT_ID PLATFORM_ENVIRONMENT_ID PLATFORM_API_KEY PLATFORM_FILE_RETENTION_CODE PLATFORM_OIDC_ISSUER PLATFORM_OIDC_CLIENT_ID PLATFORM_OIDC_REDIRECT_URI OIDC_POST_LOGOUT_REDIRECT_URI
NONPROD_REQUIRED_ENV=PROJECT_SOURCE_DIR JAVA_IMAGE NODE_IMAGE
PROD_REQUIRED_ENV=BACKEND_APP_IMAGE FRONTEND_APP_IMAGE PDF_APP_IMAGE BACKUP_DIR
BASE_DIRECTORIES=DB_DATA_DIR
NONPROD_DIRECTORIES=PROJECT_SOURCE_DIR
PROD_DIRECTORIES=BACKUP_DIR
RUNTIME_FILES=compose.yml infra/nginx/default.conf infra/postgres/backup.sh infra/postgres/restore-check.sh scripts/project.conf scripts/common.sh scripts/docker.sh scripts/deploy.sh
SOPS_RUNTIME_FILES=scripts/env.sh .sops.yaml
