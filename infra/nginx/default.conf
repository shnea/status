map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_protocol {
    default $scheme;
    https https;
    http http;
}
# Public file access checks the current published snapshot, independently of login.
# Forwarding session cookies would serialize concurrent reads on the same DB session.
map "$request_method:$uri" $backend_cookie {
    default $http_cookie;
    ~^(GET|HEAD):/api/public/files/[^/]+/[^/]+/(views|content/(original|preview|thumbnail|download)|hls/[^/]+)$ "";
    ~^(GET|HEAD):/api/public/site/files/[^/]+/content/preview$ "";
}
resolver 127.0.0.11 valid=5s ipv6=off;
upstream status_backend {
    zone status_backend 64k;
    server backend:8080 resolve;
}
upstream status_frontend {
    zone status_frontend 64k;
    server frontend:3000 resolve;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    location ~ ^/(api/|oauth2/|callback$|logout$|actuator/health$) {
        proxy_pass http://status_backend;
        proxy_set_header Cookie $backend_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_protocol;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        proxy_pass http://status_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_protocol;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
