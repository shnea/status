name: status
x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:?APP_ENV required}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL required}
  DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB required}
  DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER required}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
  PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:?PLATFORM_BASE_URL required}
  PLATFORM_PROJECT_ID: ${PLATFORM_PROJECT_ID:?PLATFORM_PROJECT_ID required}
  PLATFORM_ENVIRONMENT_ID: ${PLATFORM_ENVIRONMENT_ID:?PLATFORM_ENVIRONMENT_ID required}
  PLATFORM_API_KEY: ${PLATFORM_API_KEY:?PLATFORM_API_KEY required}
  PLATFORM_FILE_RETENTION_CODE: ${PLATFORM_FILE_RETENTION_CODE:?PLATFORM_FILE_RETENTION_CODE required}
  PLATFORM_OIDC_ISSUER: ${PLATFORM_OIDC_ISSUER:?PLATFORM_OIDC_ISSUER required}
  PLATFORM_OIDC_CLIENT_ID: ${PLATFORM_OIDC_CLIENT_ID:?PLATFORM_OIDC_CLIENT_ID required}
  PLATFORM_OIDC_REDIRECT_URI: ${PLATFORM_OIDC_REDIRECT_URI:?PLATFORM_OIDC_REDIRECT_URI required}
  OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:?OIDC_POST_LOGOUT_REDIRECT_URI required}
  ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER-}
  ADMIN_OIDC_SUBJECT: ${ADMIN_OIDC_SUBJECT-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?SESSION_COOKIE_SECURE required}
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT required}:5432"
    volumes:
      - type: bind
        source: ${DB_DATA_DIR:?DB_DATA_DIR required}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-test-init:
    profiles: ["development"]
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required}
    entrypoint: ["sh", "/scripts/init-test-db.sh"]
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV required}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - ./infra/postgres/init-test-db.sh:/scripts/init-test-db.sh:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: ["development"]
    image: ${JAVA_IMAGE:-eclipse-temurin:17-jdk-jammy}
    working_dir: /workspace
    command: ["sh", "-c", "sh ./gradlew --no-daemon bootRun"]
    environment:
      <<: *backend-environment
      TEST_DATABASE_URL: jdbc:postgresql://db:5432/status_test
      TEST_MEDIA_DIR: /media-fixtures
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/backend:/workspace
      - ${PROJECT_SOURCE_DIR:-.}/.runtime/browser-check/media:/media-fixtures:ro
      - gradle-cache:/root/.gradle
      - backend-build:/workspace/build
    depends_on:
      db-test-init:
        condition: service_completed_successfully
    expose: ["8080"]

  frontend:
    profiles: ["development"]
    image: ${NODE_IMAGE:-node:24-bookworm-slim}
    working_dir: /workspace
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment: &frontend-environment
      BACKEND_URL: http://backend:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL required}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION-}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/frontend:/workspace
      - frontend-deps:/workspace/node_modules
      - frontend-next:/workspace/.next
    expose: ["3000"]

  pdf:
    profiles: ["development"]
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /work
    command: ["sh", "-c", "cp /source/package.json /source/package-lock.json /work/ && npm ci --no-audit --no-fund && cp /source/server.mjs /work/server.mjs && node /work/server.mjs"]
    environment:
      APP_ORIGIN: http://nginx
    shm_size: "1gb"
    volumes:
      - ./infra/pdf:/source:ro
      - pdf-deps:/work/node_modules
    expose: ["3001"]

  nginx:
    profiles: ["development"]
    image: ${NGINX_IMAGE:?NGINX_IMAGE required}
    ports:
      - "${APP_BIND_ADDRESS:?APP_BIND_ADDRESS required}:${APP_PORT:?APP_PORT required}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]


  backend-runtime:
    profiles: ["runtime"]
    image: ${BACKEND_APP_IMAGE:-status-backend:local}
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [backend]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend-runtime:
    profiles: ["runtime"]
    image: ${FRONTEND_APP_IMAGE:-status-frontend:local}
    environment: *frontend-environment
    networks:
      default:
        aliases: [frontend]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  pdf-runtime:
    profiles: ["runtime"]
    image: ${PDF_APP_IMAGE:-status-pdf:local}
    environment:
      APP_ORIGIN: http://nginx
    shm_size: "1gb"
    networks:
      default:
        aliases: [pdf]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  nginx-runtime:
    profiles: ["runtime"]
    image: ${NGINX_IMAGE:?NGINX_IMAGE required}
    ports:
      - "${APP_BIND_ADDRESS:?APP_BIND_ADDRESS required}:${APP_PORT:?APP_PORT required}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases: [nginx]
    depends_on:
      backend-runtime:
        condition: service_healthy
      frontend-runtime:
        condition: service_healthy
      pdf-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 6
    restart: unless-stopped

  db-backup:
    profiles: ["ops"]
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required}
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      BACKUP_CONFIGURED: ${BACKUP_DIR:+true}
    volumes:
      - ./infra/postgres/backup.sh:/scripts/backup.sh:ro
      - type: bind
        source: ${BACKUP_DIR:-./.runtime/backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  db-restore-check:
    profiles: ["ops"]
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required}
    entrypoint: ["sh", "/scripts/restore-check.sh"]
    environment:
      POSTGRES_DB: status_restore_check
      POSTGRES_USER: restore_check
      POSTGRES_PASSWORD: isolated-restore-check
      BACKUP_FILE: ${BACKUP_FILE-}
    network_mode: none
    volumes:
      - ./infra/postgres/restore-check.sh:/scripts/restore-check.sh:ro
      - type: bind
        source: ${BACKUP_DIR:-./.runtime/backups}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/lib/postgresql/data

  pdf-check:
    profiles: ["checks"]
    build:
      context: ./infra/checks
      dockerfile: pdf.Dockerfile
    working_dir: /work
    command: ["sh", "/scripts/pdf.sh"]
    shm_size: "1gb"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/frontend:/source:ro
      - ./infra/pdf:/pdf-source:ro
      - ./infra/checks:/scripts:ro
      - pdf-check-deps:/work/node_modules
      - ${PROJECT_SOURCE_DIR:-.}/.runtime/browser-check:/artifacts

  frontend-check:
    profiles: ["checks"]
    image: ${NODE_IMAGE:-node:24-bookworm-slim}
    working_dir: /work
    command: ["sh", "/scripts/frontend.sh"]
    environment:
      CHECK_MODE: build
      BACKEND_URL: http://backend:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL required}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/frontend:/source:ro
      - ./infra/checks:/scripts:ro
      - frontend-check-deps:/work/node_modules

  browser-check:
    profiles: ["checks"]
    build:
      context: ./infra/checks
      dockerfile: browser.Dockerfile
    working_dir: /work
    command: ["sh", "/scripts/frontend.sh"]
    shm_size: "1gb"
    environment:
      CHECK_MODE: browser
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL required}
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/frontend:/source:ro
      - ./infra/checks:/scripts:ro
      - browser-check-deps:/work/node_modules
      - ${PROJECT_SOURCE_DIR:-.}/.runtime/browser-check:/artifacts

  ai-check:
    profiles: ["checks"]
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /work
    command: ["sh", "/scripts/ai.sh"]
    shm_size: "1gb"
    volumes:
      - ${PROJECT_SOURCE_DIR:-.}/frontend:/source:ro
      - ./infra/checks:/scripts:ro
      - ai-check-deps:/work/node_modules
      - ${PROJECT_SOURCE_DIR:-.}/.runtime/browser-check:/artifacts

  backend-image:
    platform: ${APP_IMAGE_PLATFORM:-linux/amd64}
    profiles: ["package"]
    image: ${BACKEND_APP_IMAGE:-status-backend:local}
    build:
      context: ./backend
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:17-jdk-jammy}

  frontend-image:
    platform: ${APP_IMAGE_PLATFORM:-linux/amd64}
    profiles: ["package"]
    image: ${FRONTEND_APP_IMAGE:-status-frontend:local}
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}

  pdf-image:
    platform: ${APP_IMAGE_PLATFORM:-linux/amd64}
    profiles: ["package"]
    image: ${PDF_APP_IMAGE:-status-pdf:local}
    build:
      context: ./infra/pdf

volumes:
  gradle-cache:
  backend-build:
  frontend-deps:
  frontend-next:
  frontend-check-deps:
  browser-check-deps:
  pdf-deps:
  pdf-check-deps:
  ai-check-deps:
