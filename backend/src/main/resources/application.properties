spring.application.name=status
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=STATUS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE}
spring.session.timeout=12h
spring.session.jdbc.initialize-schema=never
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.security.oauth2.client.registration.platform.client-id=${PLATFORM_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.platform.client-authentication-method=none
spring.security.oauth2.client.registration.platform.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.platform.scope=openid,profile,email
spring.security.oauth2.client.registration.platform.redirect-uri=${PLATFORM_OIDC_REDIRECT_URI}
spring.security.oauth2.client.provider.platform.issuer-uri=${PLATFORM_OIDC_ISSUER}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
status.environment=${APP_ENV}
status.public-url=${APP_PUBLIC_URL}
status.platform-base-url=${PLATFORM_BASE_URL}
status.project-id=${PLATFORM_PROJECT_ID}
status.environment-id=${PLATFORM_ENVIRONMENT_ID}
status.platform-key=${PLATFORM_API_KEY}
status.issuer=${PLATFORM_OIDC_ISSUER}
status.redirect-uri=${PLATFORM_OIDC_REDIRECT_URI}
status.logout-redirect-uri=${OIDC_POST_LOGOUT_REDIRECT_URI}
status.admin-issuer=${ADMIN_OIDC_ISSUER:}
status.admin-subject=${ADMIN_OIDC_SUBJECT:}
status.secure-cookie=${SESSION_COOKIE_SECURE}

status.file-retention-code=${PLATFORM_FILE_RETENTION_CODE}
